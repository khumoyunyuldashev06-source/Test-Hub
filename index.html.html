<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TestHub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
:root{
  --bg:#03040d;--card:#0b0d1e;--border:#181e3a;--border2:#1f2745;
  --accent:#6257ff;--accent2:#b94dff;--green:#00e591;--red:#ff3355;--yellow:#ffc300;
  --text:#d8dcff;--muted:#404878;--white:#fff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 10% -5%,rgba(98,87,255,.14) 0%,transparent 65%),
             radial-gradient(ellipse 60% 50% at 90% 100%,rgba(185,77,255,.09) 0%,transparent 65%);}
.app{position:relative;z-index:1;min-height:100vh;}
.screen{display:none;}
.screen.active{display:flex;flex-direction:column;animation:fu .32s ease both;}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* HOME */
#home{min-height:100vh;}
.home-hero{padding:32px 22px 20px;text-align:center;
  background:linear-gradient(180deg,rgba(98,87,255,.08) 0%,transparent 100%);
  border-bottom:1px solid var(--border);}
.brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:16px;}
.brand-ico{width:42px;height:42px;border-radius:13px;font-size:22px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 20px rgba(98,87,255,.4);}
.brand-name{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;
  background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-h{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;line-height:1.2;margin-bottom:6px;color:var(--white);}
.hero-h span{background:linear-gradient(90deg,#8078ff,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.chip{background:rgba(98,87,255,.1);border:1px solid rgba(98,87,255,.2);border-radius:99px;
  padding:4px 11px;font-size:11px;color:#8888cc;font-weight:500;}

.sec-lbl{padding:18px 20px 8px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);}

.subjects{padding:0 13px 90px;display:flex;flex-direction:column;gap:10px;}

.sc{background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:16px 17px;display:flex;align-items:center;gap:13px;cursor:pointer;
  transition:border-color .18s,box-shadow .18s,transform .15s;position:relative;overflow:hidden;}
.sc::before{content:'';position:absolute;inset:0;border-radius:18px;opacity:0;
  background:linear-gradient(135deg,var(--sc-g,rgba(98,87,255,.07)),transparent);transition:opacity .2s;}
.sc:hover::before,.sc:focus::before{opacity:1;}
.sc:hover{border-color:var(--sc-b,rgba(98,87,255,.38));box-shadow:0 0 18px rgba(98,87,255,.1);}
.sc:active{transform:scale(.975);}
.sc.locked{opacity:.4;cursor:default;}
.sc-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.sc-info{flex:1;min-width:0;}
.sc-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#e8eaff;
  margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-meta{font-size:12px;color:rgba(100,108,160,.9);}
.sc-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;
  padding:7px 15px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
  box-shadow:0 2px 12px rgba(98,87,255,.3);}
.sc-btn.lock{background:var(--border2);color:var(--muted);box-shadow:none;}

.footer-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(3,4,13,.94);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);padding:10px 20px 18px;text-align:center;font-size:12px;color:var(--muted);}

/* QUIZ */
#quiz-screen{min-height:100vh;}
.qhdr{display:flex;align-items:center;gap:10px;padding:13px 15px;position:sticky;top:0;z-index:30;
  background:rgba(3,4,13,.97);backdrop-filter:blur(22px);border-bottom:1px solid var(--border);}
.back{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text);
  flex-shrink:0;transition:all .14s;}
.back:active{transform:scale(.9);}
.qhdr-mid{flex:1;min-width:0;}
.qhdr-nm{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8eaff;}
.qhdr-pr{font-size:11px;color:var(--muted);}
.sc-tag{background:rgba(0,229,145,.12);border:1px solid rgba(0,229,145,.3);border-radius:99px;
  padding:5px 13px;font-size:12px;font-weight:700;color:#00e591;flex-shrink:0;white-space:nowrap;}

.pb-wrap{padding:8px 15px 6px;background:rgba(3,4,13,.97);}
.pb{height:3px;background:var(--border);border-radius:99px;overflow:hidden;}
.pb-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s ease;}

.q-area{padding:18px 17px 0;}
.q-num{display:inline-block;background:rgba(98,87,255,.13);color:#9090ff;
  font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;
  border-radius:7px;padding:3px 9px;margin-bottom:10px;}
.q-text{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;line-height:1.55;
  color:var(--white);margin-bottom:0;}

.opts{padding:14px 17px 140px;display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;
  border:1.5px solid var(--border);background:rgba(15,19,34,.95);cursor:pointer;width:100%;
  text-align:left;transition:all .16s;position:relative;overflow:hidden;}
.opt:active:not(.ans){transform:scale(.98);}
.opt.ans{cursor:default;}
.opt-let{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;
  font-size:12px;font-weight:800;color:rgba(180,185,220,.7);flex-shrink:0;
  border:1px solid rgba(255,255,255,.08);transition:all .16s;}
.opt-txt{font-size:14px;color:rgba(200,205,235,.85);line-height:1.45;flex:1;transition:color .16s;font-weight:400;}
.opt-ico{font-size:17px;flex-shrink:0;opacity:0;transition:opacity .16s;}

.opt.correct{background:rgba(0,229,145,.08);border-color:rgba(0,229,145,.6);}
.opt.correct .opt-let{background:var(--green);color:#000;font-weight:800;border-color:var(--green);}
.opt.correct .opt-txt{color:#00e591;font-weight:600;}
.opt.correct .opt-ico{opacity:1;}
.opt.wrong{background:rgba(255,51,85,.07);border-color:rgba(255,51,85,.5);}
.opt.wrong .opt-let{background:var(--red);color:#fff;border-color:var(--red);}
.opt.wrong .opt-txt{color:#ff5577;}
.opt.wrong .opt-ico{opacity:1;}
.opt.dim{opacity:.28;}

.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);animation:rpl .5s ease-out;pointer-events:none;}
@keyframes rpl{from{transform:scale(0);opacity:1}to{transform:scale(5);opacity:0}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shk{animation:shk .36s ease;}

/* FEEDBACK */
.fb{position:fixed;bottom:0;left:0;right:0;z-index:40;padding:16px 18px 30px;
  background:rgba(8,10,22,0.99);backdrop-filter:blur(28px);
  border-top:1px solid rgba(255,255,255,.07);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.34,1.56,.64,1);}
.fb.show{transform:translateY(0);}
.fb-row{display:flex;align-items:center;gap:13px;margin-bottom:14px;}
.fb-em{font-size:30px;flex-shrink:0;}
.fb-ti{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--white);}
.fb-ti.ok{color:#00e591;}
.fb-ti.no{color:#ff4466;}
.fb-su{font-size:12.5px;color:rgba(140,145,190,.8);margin-top:3px;line-height:1.45;}
.nx-btn{width:100%;padding:15px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#6257ff,#b94dff);
  color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;
  cursor:pointer;transition:all .15s;letter-spacing:.3px;
  box-shadow:0 4px 20px rgba(98,87,255,.35);}
.nx-btn:active{transform:scale(.97);opacity:.88;}

/* RESULT */
#result-screen{min-height:100vh;align-items:center;justify-content:center;padding:36px 22px;text-align:center;}
.res-em{font-size:70px;margin-bottom:14px;}
.res-ti{font-family:'Syne',sans-serif;font-size:25px;font-weight:800;margin-bottom:6px;}
.res-su{color:var(--muted);font-size:13px;margin-bottom:26px;line-height:1.5;}
.ring-wrap{width:156px;height:156px;position:relative;margin:0 auto 26px;}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border2);stroke-width:9;}
.ring-fill{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);}
.ring-ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-pct{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;}
.ring-lbl{font-size:10px;color:var(--muted);}
.res-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;max-width:300px;margin-bottom:24px;}
.rs-box{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 6px;}
.rs-v{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:2px;}
.rs-l{font-size:11px;color:var(--muted);}
.res-btns{display:flex;flex-direction:column;gap:9px;width:100%;max-width:300px;}
.btn-r{padding:14px;border-radius:13px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-h{padding:14px;border-radius:13px;border:1px solid var(--border);background:var(--card);
  color:var(--text);font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-r:active,.btn-h:active{transform:scale(.97);}

/* CONFETTI */
.conf-w{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden;}
.conf{position:absolute;top:-10px;border-radius:2px;animation:fall linear both;}
@keyframes fall{from{transform:translateY(-10px) rotate(0)}to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* TOAST */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--card);border:1px solid var(--border2);color:var(--text);
  padding:9px 17px;border-radius:10px;font-size:13px;z-index:999;
  white-space:nowrap;opacity:0;transition:all .28s;pointer-events:none;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-hero">
    <div class="brand">
      <div class="brand-ico">🧠</div>
      <div class="brand-name">TestHub</div>
    </div>
    <div class="hero-h">Bilimingizni <span>sinang!</span></div>
    <div class="hero-sub">Fanni tanlang va testni boshlang</div>
    <div class="chips">
      <div class="chip">🎓 4 ta fan</div>
      <div class="chip">📝 360+ savol</div>
      <div class="chip">⚡ Tez natija</div>
    </div>
  </div>
  <div class="sec-lbl">FANLAR</div>
  <div class="subjects" id="subjectsGrid"></div>
  <div class="footer-bar">Yangi fanlar tez orada qo'shiladi 🚀</div>
</div>

<!-- QUIZ -->
<div id="quiz-screen" class="screen">
  <div class="qhdr">
    <div class="back" onclick="goHome()">←</div>
    <div class="qhdr-mid">
      <div class="qhdr-nm" id="qName"></div>
      <div class="qhdr-pr" id="qProg"></div>
    </div>
    <div class="sc-tag" id="scTag">✓ 0</div>
  </div>
  <div class="pb-wrap"><div class="pb"><div class="pb-fill" id="pbFill" style="width:0%"></div></div></div>
  <div class="q-area">
    <div class="q-num" id="qNum">SAVOL 1</div>
    <div class="q-text" id="qTxt"></div>
  </div>
  <div class="opts" id="optsList"></div>
  <div class="fb" id="fb">
    <div class="fb-row">
      <div class="fb-em" id="fbEm"></div>
      <div><div class="fb-ti" id="fbTi"></div><div class="fb-su" id="fbSu"></div></div>
    </div>
    <button class="nx-btn" id="nxBtn" onclick="nextQ()">Keyingisi →</button>
  </div>
</div>

<!-- RESULT -->
<div id="result-screen" class="screen">
  <div class="res-em" id="resEm">🏆</div>
  <div class="res-ti" id="resTi"></div>
  <div class="res-su" id="resSu"></div>
  <div class="ring-wrap">
    <svg viewBox="0 0 160 160">
      <circle class="ring-bg" cx="80" cy="80" r="68"/>
      <circle class="ring-fill" id="ringFill" cx="80" cy="80" r="68" stroke-dasharray="427" stroke-dashoffset="427"/>
    </svg>
    <div class="ring-ctr">
      <div class="ring-pct" id="ringPct">0%</div>
      <div class="ring-lbl">natija</div>
    </div>
  </div>
  <div class="res-stats">
    <div class="rs-box"><div class="rs-v" id="rsOk" style="color:var(--green)">0</div><div class="rs-l">To'g'ri</div></div>
    <div class="rs-box"><div class="rs-v" id="rsNo" style="color:var(--red)">0</div><div class="rs-l">Noto'g'ri</div></div>
    <div class="rs-box"><div class="rs-v" id="rsAll" style="color:var(--accent)">0</div><div class="rs-l">Jami</div></div>
  </div>
  <div class="res-btns">
    <button class="btn-r" onclick="retry()">🔄 Qayta urinish</button>
    <button class="btn-h" onclick="goHome()">🏠 Bosh sahifa</button>
  </div>
</div>

</div>
<div class="conf-w" id="confW"></div>
<div class="toast" id="toast"></div>

<script>
const SUBJECTS=[

questions:[

      <div class="sc-info"><div class="sc-name">${s.name}</div><div class="sc-meta">${s.desc}</div></div>
      <div class="sc-btn${s.locked?' lock':''}">${s.locked?'🔒':'▶ Start'}</div>`;
    d.onclick=s.locked?()=>toast('Tez orada! 🚀'):()=>start(s);
    g.appendChild(d);
  });
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('active');s.style.display='';});
  const el=document.getElementById(id);el.style.display='flex';
  requestAnimationFrame(()=>el.classList.add('active'));
}
function goHome(){show('home');document.getElementById('fb').classList.remove('show');}

function start(s){
  cur=s;
  qs=[...s.questions].sort(()=>Math.random()-.5).slice(0,Math.min(30,s.questions.length));
  qi=0;score=0;show('quiz-screen');renderQ();
}

function renderQ(){
  ans=false;
  const q=qs[qi],tot=qs.length;
  document.getElementById('qName').textContent=cur.name;
  document.getElementById('qProg').textContent=`Savol ${qi+1} / ${tot}`;
  document.getElementById('scTag').textContent=`✓ ${score}`;
  document.getElementById('pbFill').style.width=`${qi/tot*100}%`;
  document.getElementById('qNum').textContent=`SAVOL ${qi+1}`;
  document.getElementById('qTxt').textContent=q.q;
  document.getElementById('fb').classList.remove('show');
  const L=['A','B','C','D'],list=document.getElementById('optsList');list.innerHTML='';
  q.o.forEach((o,j)=>{
    const btn=document.createElement('button');btn.className='opt';
    btn.innerHTML=`<div class="opt-let">${L[j]}</div><div class="opt-txt">${o}</div><div class="opt-ico">${j===q.c?'✓':'✗'}</div>`;
    btn.onclick=e=>pick(btn,j,q.c,e);list.appendChild(btn);
  });
  document.getElementById('quiz-screen').scrollTo({top:0,behavior:'smooth'});
}

function pick(btn,ch,co,e){
  if(ans)return;ans=true;
  const r=document.createElement('div');r.className='ripple';
  const rc=btn.getBoundingClientRect(),sz=Math.max(btn.offsetWidth,btn.offsetHeight);
  r.style.cssText=`width:${sz}px;height:${sz}px;left:${(e.clientX||rc.left+rc.width/2)-rc.left-sz/2}px;top:${(e.clientY||rc.top+rc.height/2)-rc.top-sz/2}px`;
  btn.appendChild(r);setTimeout(()=>r.remove(),600);
  const ok=ch===co;
  document.querySelectorAll('.opt').forEach((b,j)=>{
    b.classList.add('ans');
    if(j===co)b.classList.add('correct');
    else if(j===ch&&!ok)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(ok){score++;document.getElementById('scTag').textContent=`✓ ${score}`;}
  else btn.classList.add('shk');
  showFB(ok,ok?null:qs[qi].o[co]);
}

function showFB(ok,ct){
  const oe=['🎉','🔥','✨','💯','⚡'],ne=['💪','😤','📖','🙁'];
  const ot=['Ajoyib!','To\'g\'ri!','Zo\'r!','Barakallo!','Perfect!'];
  document.getElementById('fbEm').textContent=ok?oe[~~(Math.random()*oe.length)]:ne[~~(Math.random()*ne.length)];
  const t=document.getElementById('fbTi');
  t.textContent=ok?ot[~~(Math.random()*ot.length)]:'Noto\'g\'ri!';
  t.className='fb-ti '+(ok?'ok':'no');
  document.getElementById('fbSu').textContent=ok?'Davom eting, siz zo\'rsiz!':ct?`To'g'ri: ${ct}`:'Keyingi safar to\'g\'ri bo\'ladi!';
  document.getElementById('nxBtn').textContent=qi<qs.length-1?'Keyingisi →':'Natijani ko\'rish 🏆';
  document.getElementById('fb').classList.add('show');
}

function nextQ(){qi++;if(qi>=qs.length)showResult();else renderQ();}

function showResult(){
  document.getElementById('fb').classList.remove('show');show('result-screen');
  const tot=qs.length,wrong=tot-score,pct=Math.round(score/tot*100);
  document.getElementById('rsOk').textContent=score;
  document.getElementById('rsNo').textContent=wrong;
  document.getElementById('rsAll').textContent=tot;
  let em,ti,su;
  if(pct>=90){em='🏆';ti='Ustoz darajasi!';su='Siz haqiqiy bilimdon!';}
  else if(pct>=75){em='🎯';ti='Zo\'r natija!';su='Yuqori daraja, davom eting!';}
  else if(pct>=50){em='💪';ti='Yaxshi!';su='Yana bir oz mashq qiling!';}
  else{em='📖';ti='Ko\'proq o\'qing!';su='Bilimlaringizni oshiring va qayta urining.';}
  document.getElementById('resEm').textContent=em;
  document.getElementById('resTi').textContent=ti;
  document.getElementById('resSu').textContent=`${su} — ${pct}% natija`;
  const circ=2*Math.PI*68,off=circ*(1-pct/100),fill=document.getElementById('ringFill');
  fill.style.strokeDasharray=circ;fill.style.strokeDashoffset=circ;
  fill.style.stroke=pct>=75?'var(--green)':pct>=50?'var(--yellow)':'var(--red)';
  document.getElementById('ringPct').style.color=fill.style.stroke;
  document.getElementById('ringPct').textContent='0%';
  setTimeout(()=>{fill.style.strokeDashoffset=off;anim(document.getElementById('ringPct'),0,pct,1000,v=>`${v}%`);},300);
  if(pct>=75)confetti();
}
function retry(){start(cur);}

function anim(el,from,to,dur,fmt){
  const s=performance.now();
  const f=now=>{const t=Math.min((now-s)/dur,1);el.textContent=fmt(Math.round(from+(to-from)*(1-Math.pow(1-t,3))));if(t<1)requestAnimationFrame(f);};
  requestAnimationFrame(f);
}
function confetti(){
  const w=document.getElementById('confW');w.innerHTML='';
  const cols=['#6257ff','#b94dff','#00e591','#ffc300','#ff3355','#00b4ff'];
  for(let i=0;i<55;i++){
    const p=document.createElement('div');p.className='conf';
    p.style.cssText=`left:${Math.random()*100}%;background:${cols[~~(Math.random()*cols.length)]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.8}s;width:${5+Math.random()*8}px;height:${7+Math.random()*12}px;border-radius:${Math.random()>.5?'50%':'3px'};`;
    w.appendChild(p);
  }
  setTimeout(()=>w.innerHTML='',4000);
}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2500);
}
init();
</script>
